name: NMC upstream sync
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: nmc-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'cromulus/paperclip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const sync = require('./scripts/nmc/upstream-sync.cjs');
            await sync({ github, context, core });
