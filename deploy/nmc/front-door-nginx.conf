worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    log_format route '$request_method $status upstream=$upstream_addr';
    access_log /dev/stdout route;
    server_tokens off;
    client_max_body_size 10m;
    # Browser endpoints use PocketID; only these native-authenticated machine
    # endpoints go directly to Paperclip. Do not broaden either regex.
    map "$request_method:$uri" $machine_endpoint {
        default 0;
        # OAuth Client ID metadata is public; only this exact GET bypasses SSO.
        "~^GET:/api/tools/oauth/client-metadata$" 1;
        "~^POST:/api/routine-triggers/public/[a-f0-9]{24}/fire$" 1;
        "~^(GET|POST|DELETE):/mcp/paperclip$" 1;
        "~^GET:/\.well-known/oauth-authorization-server$" 1;
        "~^GET:/\.well-known/oauth-protected-resource(/mcp/paperclip)?$" 1;
        "~^POST:/mcp/oauth/(register|token|revoke|device_authorization)$" 1;
    }
    # Signed native inbound webhooks bypass PocketID only on exact POST paths.
    # Matching the raw request URI excludes query strings.
    map "$request_method:$request_uri" $signed_webhook_endpoint {
        default 0;
        "~^POST:/api/chat-webhooks/[A-Za-z0-9_-]{43}/(slack|github)$" 1;
        "~^POST:/api/chat-webhooks/agentmail/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" 1;
    }
    server {
        listen 127.0.0.1:3180;
        server_name paperclip.koi-neon.ts.net;
        # Internal error dispatch preserves the original method and body.
        error_page 418 = @native_auth;
        location / {
            if ($machine_endpoint) { return 418; }
            if ($signed_webhook_endpoint) { return 418; }
            proxy_pass http://127.0.0.1:4180;
            proxy_http_version 1.1;
            proxy_set_header Host paperclip.koi-neon.ts.net;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host paperclip.koi-neon.ts.net;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location @native_auth {
            proxy_pass http://127.0.0.1:3100;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host paperclip.koi-neon.ts.net;
            proxy_set_header Connection '';
            proxy_set_header X-Forwarded-Host paperclip.koi-neon.ts.net;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Accept $http_accept;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Mcp-Session-Id $http_mcp_session_id;
            proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
            proxy_set_header Last-Event-ID $http_last_event_id;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Paperclip-Timestamp $http_x_paperclip_timestamp;
            proxy_set_header X-Paperclip-Signature $http_x_paperclip_signature;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
            proxy_set_header X-Hub-Signature $http_x_hub_signature;
            proxy_set_header X-GitHub-Event $http_x_github_event;
            proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
            proxy_set_header X-Slack-Request-Timestamp $http_x_slack_request_timestamp;
            proxy_set_header X-Slack-Signature $http_x_slack_signature;
            proxy_set_header Svix-Id $http_svix_id;
            proxy_set_header Svix-Timestamp $http_svix_timestamp;
            proxy_set_header Svix-Signature $http_svix_signature;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
}
