worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    # Do not log payloads, secrets, or trigger URLs.
    log_format webhook '$request_method $status $request_time';
    access_log /dev/stdout webhook;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    limit_req_zone $server_name zone=webhooks:1m rate=20r/s;
    limit_req_status 429;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    map "$request_method:$request_uri" $mcp_endpoint {
        default 0;
        "~^(GET|POST|DELETE):/mcp/paperclip$" 1;
        "~^GET:/\\.well-known/oauth-authorization-server$" 1;
        "~^GET:/\\.well-known/oauth-protected-resource(/mcp/paperclip)?$" 1;
        "~^POST:/mcp/oauth/(register|token|revoke|device_authorization)$" 1;
    }
    map "$request_method:$request_uri" $chat_email_webhook {
        default 0;
        "~^POST:/api/chat-webhooks/[A-Za-z0-9_-]{43}/(slack|github)$" 1;
        "~^POST:/api/chat-webhooks/agentmail/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" 1;
    }
    server {
        listen 8080 default_server;
        server_name paperclip-hooks.nmc-atelier.com;
        if ($host != paperclip-hooks.nmc-atelier.com) { return 404; }
        location ~ "^/api/routine-triggers/public/[a-f0-9]{24}/fire$" {
            # Check the original URI as well as nginx's normalized location.
            if ($request_uri !~ "^/api/routine-triggers/public/[a-f0-9]{24}/fire$") { return 404; }
            if ($request_method != POST) { return 405; }
            limit_req zone=webhooks burst=100 nodelay;
            set $paperclip_origin paperclip.koi-neon.ts.net;
            proxy_pass https://$paperclip_origin$request_uri;
            proxy_ssl_server_name on;
            proxy_ssl_name paperclip.koi-neon.ts.net;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 3;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_redirect off;
            proxy_pass_request_headers off;
            proxy_set_header Host paperclip.koi-neon.ts.net;
            proxy_set_header Connection '';
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-Paperclip-Timestamp $http_x_paperclip_timestamp;
            proxy_set_header X-Paperclip-Signature $http_x_paperclip_signature;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
            proxy_set_header X-Hub-Signature $http_x_hub_signature;
            proxy_set_header X-GitHub-Event $http_x_github_event;
            proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
        }
        location ~ "^/api/chat-webhooks/[A-Za-z0-9_-]{43}/(slack|github)$" {
            if ($request_uri !~ "^/api/chat-webhooks/[A-Za-z0-9_-]{43}/(slack|github)$") { return 404; }
            if ($request_method != POST) { return 405; }
            limit_req zone=webhooks burst=100 nodelay;
            set $paperclip_origin paperclip.koi-neon.ts.net;
            proxy_pass https://$paperclip_origin$request_uri;
            proxy_ssl_server_name on;
            proxy_ssl_name paperclip.koi-neon.ts.net;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 3;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_redirect off;
            proxy_pass_request_headers off;
            proxy_set_header Host paperclip.koi-neon.ts.net;
            proxy_set_header Connection '';
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-Slack-Request-Timestamp $http_x_slack_request_timestamp;
            proxy_set_header X-Slack-Signature $http_x_slack_signature;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
            proxy_set_header X-Hub-Signature $http_x_hub_signature;
            proxy_set_header X-GitHub-Event $http_x_github_event;
            proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
        }
        location ~ "^/api/chat-webhooks/agentmail/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
            if ($request_uri !~ "^/api/chat-webhooks/agentmail/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$") { return 404; }
            if ($request_method != POST) { return 405; }
            limit_req zone=webhooks burst=100 nodelay;
            set $paperclip_origin paperclip.koi-neon.ts.net;
            proxy_pass https://$paperclip_origin$request_uri;
            proxy_ssl_server_name on;
            proxy_ssl_name paperclip.koi-neon.ts.net;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 3;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_redirect off;
            proxy_pass_request_headers off;
            proxy_set_header Host paperclip.koi-neon.ts.net;
            proxy_set_header Connection '';
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Svix-Id $http_svix_id;
            proxy_set_header Svix-Timestamp $http_svix_timestamp;
            proxy_set_header Svix-Signature $http_svix_signature;
        }
        error_page 418 = @native_mcp;
        location / {
            if ($mcp_endpoint) { return 418; }
            if ($chat_email_webhook) { return 418; }
            return 404;
        }
        location @native_mcp {
            # OAuth consent stays behind PocketID on the private browser origin.
            # Machine requests authenticate using Paperclip's native OAuth tokens.
            set $paperclip_origin paperclip.koi-neon.ts.net;
            proxy_pass https://$paperclip_origin$request_uri;
            proxy_ssl_server_name on;
            proxy_ssl_name paperclip.koi-neon.ts.net;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 3;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 30s;
            proxy_redirect off;
            proxy_buffering off;
            proxy_pass_request_headers off;
            proxy_set_header Host paperclip.koi-neon.ts.net;
            proxy_set_header Connection '';
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Accept $http_accept;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Mcp-Session-Id $http_mcp_session_id;
            proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
            proxy_set_header Last-Event-ID $http_last_event_id;
        }
    }
}
